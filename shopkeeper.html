
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakkathu Kadai - Shopkeeper Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7f5;
      color: #222;
    }
    main {
      max-width: 900px;
      margin: auto;
    }
    section {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }
    button {
      padding: 11px 16px;
      margin: 5px 5px 5px 0;
      border: 0;
      border-radius: 7px;
      background: #18794e;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #105c3a; }
    a { color: #18794e; }
  </style>
</head>
<body>
  <main>
    <h1>Pakkathu Kadai</h1>
    <h2>Shopkeeper Dashboard</h2>

    <section>
      <h3>Quick Links</h3>
      <p><a href="index.html">Open Customer Store</a></p>
      <p><a href="customer-feedback.html">Customer Feedback</a></p>
    </section>

    <section>
      <h3>Expiry Tracking & Alerts</h3>
      <p>Add product expiry dates and identify products that are expired or expiring within three days.</p>
      <button type="button" id="expiry-tracking-button">
        Open Expiry Tracker
      </button>
      <p id="expiry-status" role="status"></p>
    </section>
  </main>

  <script src="js/expiry-tracking.js"></script>
  <script>
    document.getElementById("expiry-tracking-button")
      .addEventListener("click", function () {
        if (window.PKExpiryTracking) {
          window.PKExpiryTracking.showExpiryDashboard();
        } else {
          document.getElementById("expiry-status").textContent =
            "Expiry tracker failed to load. Check js/expiry-tracking.js.";
        }
      });
  </script>
</body>
</html>
