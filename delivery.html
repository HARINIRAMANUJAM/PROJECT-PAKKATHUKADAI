```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Dashboard | Pakkathu Kadai</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .delivery-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }
    .delivery-card {
      background: #fff;
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      border: 1px solid #ddd;
      box-shadow: 0 3px 10px #0000000d;
    }
    .delivery-card p { margin: 8px 0; }
    .delivery-card select,
    .delivery-card button {
      padding: 10px;
      margin: 6px 6px 6px 0;
      border-radius: 6px;
    }
    .delivery-card button {
      cursor: pointer;
      border: 0;
      background: #176b45;
      color: white;
    }
    .status { font-weight: bold; }
    #dashboard-message { padding: 12px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Pakkathu Kadai</h1>
    <nav class="main-nav">
      <a href="index.html">Customer Store</a>
      <a href="shopkeeper.html">Shopkeeper</a>
      <a href="delivery.html">Delivery Dashboard</a>
      <button id="logout-button" type="button">Logout</button>
    </nav>
  </header>

  <main class="delivery-container">
    <h2>Delivery Dashboard</h2>
    <p>View orders and update their delivery status.</p>
    <p id="dashboard-message">Checking access...</p>
    <section id="delivery-orders"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    (() => {
      "use strict";

      const client = window.supabaseClient;
      const message = document.getElementById("dashboard-message");
      const ordersContainer = document.getElementById("delivery-orders");
      const logoutButton = document.getElementById("logout-button");

      if (!client) {
        message.textContent = "Connection failed. Check js/supabase.js.";
        return;
      }

      const allowedStatuses = [
        "pending",
        "confirmed",
        "preparing",
        "ready",
        "out_for_delivery",
        "delivered",
        "cancelled"
      ];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function formatItems(items) {
        if (!Array.isArray(items)) {
          return escapeHTML(
            typeof items === "string" ? items : JSON.stringify(items ?? {})
          );
        }

        return items.map(item => {
          const name = escapeHTML(item.name || item.product_name || "Item");
          const quantity = escapeHTML(item.quantity ?? 1);
          return `${name} × ${quantity}`;
        }).join(", ");
      }

      async function loadOrders() {
        message.textContent = "Loading orders...";
        ordersContainer.replaceChildren();

        const { data, error } = await client
          .from("Orders")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          message.textContent =
            "Could not load orders. Check Orders table permissions.";
          console.error("Order loading failed:", error);
          return;
        }

        if (!data || data.length === 0) {
          message.textContent = "No orders found yet.";
          return;
        }

        message.textContent = `${data.length} order(s) found.`;

        data.forEach(order => {
          const card = document.createElement("article");
          card.className = "delivery-card";

          const orderId = escapeHTML(order.id);
          const customer = escapeHTML(order.customer_name || "Not provided");
          const phone = escapeHTML(order.phone || "Not provided");
          const address = escapeHTML(
            order.delivery_address || "Address not provided"
          );
          const total = escapeHTML(order.total ?? "0");
          const status = allowedStatuses.includes(order.status)
            ? order.status
            : "pending";

          const options = allowedStatuses.map(option =>
            `<option value="${option}" ${
              option === status ? "selected" : ""
            }>${option.replaceAll("_", " ")}</option>`
          ).join("");

          card.innerHTML = `
            <h3>Order #${orderId}</h3>
            <p><strong>Customer:</strong> ${customer}</p>
            <p><strong>Phone:</strong> ${phone}</p>
            <p><strong>Delivery address:</strong> ${address}</p>
            <p><strong>Items:</strong> ${formatItems(order.items)}</p>
            <p><strong>Total:</strong> ₹${total}</p>
            <p><strong>Current status:</strong>
              <span class="status">${escapeHTML(status.replaceAll("_", " "))}</span>
            </p>
            <label for="status-${orderId}">Update status:</label>
            <select id="status-${orderId}">${options}</select>
            <button type="button" data-order-id="${orderId}">
              Save status
            </button>
            <p class="order-message" aria-live="polite"></p>
          `;

          const button = card.querySelector("button");
          const select = card.querySelector("select");
          const resultMessage = card.querySelector(".order-message");

          button.addEventListener("click", async () => {
            const newStatus = select.value;
            button.disabled = true;
            resultMessage.textContent = "Saving...";

            const { error: updateError } = await client
              .from("Orders")
              .update({ status: newStatus })
              .eq("id", order.id);

            button.disabled = false;

            if (updateError) {
              console.error("Status update failed:", updateError);
              resultMessage.textContent =
                "Update failed. Check database UPDATE permissions.";
              return;
            }

            resultMessage.textContent = "Status updated successfully.";
            card.querySelector(".status").textContent =
              newStatus.replaceAll("_", " ");
          });

          ordersContainer.appendChild(card);
        });
      }

      async function initialise() {
        const { data: userData, error: userError } =
          await client.auth.getUser();

        if (userError || !userData.user) {
          message.textContent = "Please log in first.";
          return;
        }

        const { data: roleData, error: roleError } = await client
          .from("user_roles")
          .select("role")
          .eq("user_id", userData.user.id)
          .maybeSingle();

        if (roleError || roleData?.role !== "delivery") {
          message.textContent = "Access denied. Delivery account required.";
          return;
        }

        await loadOrders();
      }

      logoutButton.addEventListener("click", async () => {
        const { error } = await client.auth.signOut();

        if (error) {
          message.textContent = "Logout failed. Please try again.";
          return;
        }

        window.location.href = "login.html";
      });

      initialise();
    })();
  </script>
</body>
</html>
