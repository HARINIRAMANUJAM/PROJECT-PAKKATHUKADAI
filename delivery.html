
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Dashboard | Pakkathu Kadai</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .delivery-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .delivery-card {
      background: #fff;
      color: #222;
      padding: 20px;
      margin: 16px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 3px 10px #0000000d;
    }

    .delivery-card p {
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .delivery-card select,
    .delivery-card button {
      box-sizing: border-box;
      padding: 10px;
      margin: 8px 8px 8px 0;
      border-radius: 6px;
    }

    .delivery-card button {
      cursor: pointer;
      border: 0;
      background: #176b45;
      color: white;
    }

    .delivery-card button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      font-weight: bold;
    }

    #dashboard-message {
      padding: 12px 0;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1>Pakkathu Kadai</h1>

    <nav class="main-nav">
      <a href="index.html">Customer Store</a>
      <a href="shopkeeper.html">Shopkeeper</a>
      <a href="delivery.html">Delivery Dashboard</a>
      <button id="logout-button" type="button">Logout</button>
    </nav>
  </header>

  <main class="delivery-container">
    <h2>Delivery Dashboard</h2>
    <p>View orders and update their delivery status.</p>

    <p id="dashboard-message" aria-live="polite">
      Checking access...
    </p>

    <section id="delivery-orders"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <script>
    (() => {
      "use strict";

      const client = window.supabaseClient;
      const message = document.getElementById("dashboard-message");
      const ordersContainer = document.getElementById("delivery-orders");
      const logoutButton = document.getElementById("logout-button");

      const allowedStatuses = [
        "pending",
        "confirmed",
        "preparing",
        "ready",
        "out_for_delivery",
        "delivered",
        "cancelled"
      ];

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function displayItems(items) {
        if (Array.isArray(items)) {
          return items.map(item => {
            const name = escapeHTML(
              item.name || item.product_name || "Item"
            );
            const quantity = escapeHTML(item.quantity ?? 1);
            return `${name} × ${quantity}`;
          }).join(", ");
        }

        if (items && typeof items === "object") {
          return escapeHTML(JSON.stringify(items));
        }

        return escapeHTML(items || "No item details");
      }

      async function verifyDeliveryRole() {
        const { data: userData, error: userError } =
          await client.auth.getUser();

        if (userError || !userData.user) {
          return false;
        }

        const { data: roleData, error: roleError } = await client
          .from("user_roles")
          .select("role")
          .eq("user_id", userData.user.id)
          .maybeSingle();

        if (roleError) {
          console.error("Role verification error:", roleError);
          throw new Error("Could not verify delivery account role.");
        }

        return roleData?.role === "delivery";
      }

      async function loadOrders() {
        message.textContent = "Loading orders...";
        ordersContainer.replaceChildren();

        const { data: orders, error } = await client
          .from("Orders")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          console.error("Order loading error:", error);
          message.textContent =
            "Could not load orders. Check Orders table permissions.";
          return;
        }

        if (!orders || orders.length === 0) {
          message.textContent = "No orders found yet.";
          return;
        }

        message.textContent = `${orders.length} order(s) found.`;

        orders.forEach(order => {
          const card = document.createElement("article");
          card.className = "delivery-card";

          const status = allowedStatuses.includes(order.status)
            ? order.status
            : "pending";

          const safeOrderId = escapeHTML(order.id);

          const options = allowedStatuses.map(option => `
            <option value="${option}" ${
              option === status ? "selected" : ""
            }>${option.replaceAll("_", " ")}</option>
          `).join("");

          card.innerHTML = `
            <h3>Order #${safeOrderId}</h3>
            <p><strong>Customer:</strong>
              ${escapeHTML(order.customer_name || "Not provided")}
            </p>
            <p><strong>Phone:</strong>
              ${escapeHTML(order.phone || "Not provided")}
            </p>
            <p><strong>Delivery address:</strong>
              ${escapeHTML(order.delivery_address || "Not provided")}
            </p>
            <p><strong>Fulfilment:</strong>
              ${escapeHTML(order.delivery_method || "Not specified")}
            </p>
            <p><strong>Items:</strong>
              ${displayItems(order.items)}
            </p>
            <p><strong>Total:</strong>
              ₹${escapeHTML(order.total ?? 0)}
            </p>
            <p><strong>Current status:</strong>
              <span class="status">
                ${escapeHTML(status.replaceAll("_", " "))}
              </span>
            </p>
            <label for="status-${safeOrderId}">Update status:</label>
            <select id="status-${safeOrderId}">${options}</select>
            <button type="button">Save status</button>
            <p class="order-message" aria-live="polite"></p>
          `;

          const select = card.querySelector("select");
          const button = card.querySelector("button");
          const resultMessage = card.querySelector(".order-message");

          button.addEventListener("click", async () => {
            const newStatus = select.value;

            button.disabled = true;
            resultMessage.textContent = "Saving status...";

            try {
              const hasAccess = await verifyDeliveryRole();

              if (!hasAccess) {
                resultMessage.textContent =
                  "Delivery access could not be verified. Please log in again.";
                return;
              }

              const { data: updatedOrders, error: updateError } =
                await client
                  .from("Orders")
                  .update({ status: newStatus })
                  .eq("id", order.id)
                  .select("id, status");

              if (updateError) {
                console.error("Status update error:", updateError);
                resultMessage.textContent =
                  "Update failed. Check the Console and database policies.";
                return;
              }

              if (!updatedOrders || updatedOrders.length === 0) {
                resultMessage.textContent =
                  "No order was updated. Check the database policy.";
                return;
              }

              card.querySelector(".status").textContent =
                updatedOrders[0].status.replaceAll("_", " ");

              resultMessage.textContent = "Status updated successfully.";
            } catch (error) {
              console.error("Unexpected update error:", error);
              resultMessage.textContent =
                "Unexpected error. Check the browser Console.";
            } finally {
              button.disabled = false;
            }
          });

          ordersContainer.appendChild(card);
        });
      }

      async function initialise() {
        if (!window.supabase || !client) {
          message.textContent =
            "Connection failed. Check the Supabase library and js/supabase.js.";
          console.error(
            "Supabase client missing:",
            !!window.supabase,
            !!window.supabaseClient
          );
          logoutButton.disabled = true;
          return;
        }

        try {
          const hasAccess = await verifyDeliveryRole();

          if (!hasAccess) {
            message.textContent =
              "Access denied. Please log in using your delivery account.";
            return;
          }

          await loadOrders();
        } catch (error) {
          console.error("Dashboard initialization error:", error);
          message.textContent =
            error.message || "Dashboard failed to initialize.";
        }
      }

      logoutButton.addEventListener("click", async () => {
        if (!client) {
          window.location.href = "login.html";
          return;
        }

        logoutButton.disabled = true;

        try {
          const { error } = await client.auth.signOut();

          if (error) {
            console.error("Logout error:", error);
            message.textContent = "Logout failed. Please try again.";
            logoutButton.disabled = false;
            return;
          }

          window.location.href = "login.html";
        } catch (error) {
          console.error("Unexpected logout error:", error);
          message.textContent = "Logout failed. Please try again.";
          logoutButton.disabled = false;
        }
      });

      initialise();
    })();
  </script>
</body>
</html>
