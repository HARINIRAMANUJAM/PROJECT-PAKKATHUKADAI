
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Pakkathu Kadai</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-icon">PK</span>
      <span>
        <strong>Pakkathu Kadai</strong>
        <small>Secure your local order</small>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Continue shopping</a>
      <a href="shopkeeper.html">Shopkeeper</a>
    </nav>
  </header>

  <main class="checkout-layout">
    <section class="checkout-form-section">
      <p class="eyebrow">ALMOST THERE</p>
      <h1>Complete your order</h1>
      <p>Enter your details so your selected shop can prepare your order.</p>

      <form id="checkout-form">
        <label for="customer-name">Full name</label>
        <input
          id="customer-name"
          name="customer_name"
          type="text"
          autocomplete="name"
          required
          maxlength="100"
          placeholder="Your name"
        >

        <label for="customer-phone">Phone number</label>
        <input
          id="customer-phone"
          name="phone"
          type="tel"
          autocomplete="tel"
          required
          maxlength="20"
          placeholder="Your contact number"
        >

        <label for="fulfilment-method">Choose fulfilment option</label>
        <select id="fulfilment-method" name="fulfilment_method" required>
          <option value="Pickup">Pickup from shop</option>
          <option value="Delivery">Home delivery</option>
        </select>

        <div id="delivery-address-section" hidden>
          <label for="delivery-address">Delivery address</label>
          <textarea
            id="delivery-address"
            name="delivery_address"
            rows="4"
            autocomplete="street-address"
            maxlength="500"
            placeholder="House number, street, area and city"
          ></textarea>
        </div>

        <button class="primary-button" id="place-order-button" type="submit">
          Place order
        </button>

        <p id="checkout-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <aside class="order-summary">
      <h2>Order summary</h2>
      <div id="checkout-items">
        <p>Loading your cart...</p>
      </div>
      <div class="summary-total">
        <span>Total</span>
        <strong id="checkout-total">₹0.00</strong>
      </div>
      <a class="secondary-button" href="index.html">Back to shopping</a>
    </aside>
  </main>

  <footer class="site-footer">
    <a class="brand" href="index.html">
      <span class="brand-icon">PK</span>
      <strong>Pakkathu Kadai</strong>
    </a>
    <p>Thank you for supporting local shops.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/checkout.js"></script>

  <script>
    (() => {
      const method = document.getElementById("fulfilment-method");
      const section = document.getElementById("delivery-address-section");
      const address = document.getElementById("delivery-address");

      function updateAddressField() {
        const isDelivery = method.value === "Delivery";
        section.hidden = !isDelivery;
        address.required = isDelivery;
      }

      method.addEventListener("change", updateAddressField);
      updateAddressField();
    })();
  </script>
</body>
</html>
