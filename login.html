```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pakkathu Kadai</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .login-container {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000012;
    }

    .login-container h2 {
      text-align: center;
    }

    .login-container label {
      display: block;
      margin-top: 15px;
    }

    .login-container input,
    .login-container select,
    .login-container button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .login-container button {
      margin-top: 20px;
      border: none;
      background: #176b45;
      color: white;
      cursor: pointer;
    }

    .login-container button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #login-message {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1>Pakkathu Kadai</h1>
    <nav class="main-nav">
      <a href="index.html">Customer Store</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="login-container">
    <h2>Welcome Back!</h2>
    <p>Log in to your Pakkathu Kadai account.</p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <label for="role">Login as</label>
      <select id="role" required>
        <option value="customer">Customer</option>
        <option value="shopkeeper">Shopkeeper</option>
        <option value="delivery">Delivery</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" id="login-button">Login</button>
      <p id="login-message" aria-live="polite">Checking connection...</p>
    </form>
  </main>

  <!-- Load Supabase library first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Load the shared client from the project folder -->
  <script src="/PROJECT-PAKKATHUKADAI/js/supabase.js"></script>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("login-form");
      const message = document.getElementById("login-message");
      const button = document.getElementById("login-button");

      const PROJECT_PATH = "/PROJECT-PAKKATHUKADAI/";

      function showMessage(text) {
        message.textContent = text;
      }

      const client = window.supabaseClient;

      if (!window.supabase) {
        showMessage("Supabase library failed to load. Refresh and try again.");
        console.error("Supabase CDN library is missing.");
        button.disabled = true;
        return;
      }

      if (!client) {
        showMessage(
          "Supabase client failed to initialize. Check js/supabase.js."
        );
        console.error("Supabase client is missing.");
        button.disabled = true;
        return;
      }

      showMessage("Connection initialized. Ready to log in.");

      form.addEventListener("submit", async event => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const selectedRole = document.getElementById("role").value;

        button.disabled = true;
        showMessage("Signing in...");

        try {
          const { data: authData, error: authError } =
            await client.auth.signInWithPassword({
              email,
              password
            });

          if (authError) {
            console.error("Login error:", authError);
            showMessage("Login failed. Check your email and password.");
            return;
          }

          const user = authData.user;

          if (!user) {
            showMessage("Login failed. Please try again.");
            return;
          }

          const { data: roleData, error: roleError } = await client
            .from("user_roles")
            .select("role")
            .eq("user_id", user.id)
            .maybeSingle();

          if (roleError) {
            console.error("Role lookup error:", roleError);
            await client.auth.signOut();
            showMessage("Could not verify your account role.");
            return;
          }

          if (!roleData || roleData.role !== selectedRole) {
            await client.auth.signOut();
            showMessage(
              "Selected role does not match your registered account role."
            );
            return;
          }

          showMessage("Login successful. Opening your dashboard...");

          const destinations = {
            customer: "index.html",
            shopkeeper: "shopkeeper.html",
            delivery: "delivery.html",
            admin: "admin.html"
          };

          window.location.href =
            PROJECT_PATH + destinations[selectedRole];

        } catch (error) {
          console.error("Unexpected login error:", error);
          showMessage("Something went wrong. Check the browser Console.");
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
